<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Terrones POS</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", sans-serif; background:#0f172a; color:#e2e8f0; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; }
    main { width:min(620px,88vw); background:#1e293b; border:1px solid #334155; border-radius:20px; padding:34px; box-shadow:0 25px 70px #0007; }
    h1 { margin:0 0 8px; font-size:30px; } p { color:#94a3b8; }
    .status { margin:28px 0 18px; padding:18px; border-radius:12px; background:#0f172a; display:flex; gap:14px; align-items:center; }
    .dot { width:13px; height:13px; border-radius:50%; background:#3b82f6; box-shadow:0 0 0 7px #3b82f622; }
    .error .dot { background:#ef4444; box-shadow:0 0 0 7px #ef444422; }
    button { border:0; border-radius:10px; padding:11px 18px; font-weight:700; cursor:pointer; background:#2563eb; color:white; }
    button[hidden] { display:none; } pre { display:none; max-height:230px; overflow:auto; white-space:pre-wrap; background:#020617; padding:14px; border-radius:10px; color:#cbd5e1; }
    .actions { display:flex; gap:10px; }
  </style>
</head>
<body>
  <main>
    <h1>Terrones POS local</h1>
    <p>Preparando la base de datos, el servidor y la impresión de esta PC.</p>
    <section class="status" id="status"><span class="dot"></span><div><strong id="message">Comprobando instalación…</strong><div id="detail"></div></div></section>
    <div class="actions">
      <button id="retry" hidden>Reintentar</button>
      <button id="diagnostics" hidden>Ver diagnóstico</button>
    </div>
    <pre id="output"></pre>
  </main>
  <script src="startup.js"></script>
</body>
</html>

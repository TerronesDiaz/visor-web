<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Actualización automática</title>
  <style>
    :root { color-scheme:light; font-family:"Segoe UI",sans-serif; background:#0f172a; color:#e2e8f0; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:18px; }
    main { width:100%; background:#1e293b; border:1px solid #334155; border-radius:16px; padding:22px 24px; }
    h1 { margin:0 0 6px; font-size:21px; }
    p { margin:8px 0; color:#cbd5e1; font-size:14px; line-height:1.45; }
    #notes { color:#94a3b8; font-size:13px; max-height:84px; overflow:auto; }
    #countdown { font-size:15px; color:#f8fafc; font-weight:650; }
    .actions { display:flex; gap:10px; margin-top:16px; }
    button { border:0; border-radius:9px; padding:11px 16px; font-weight:700; cursor:pointer; background:#2563eb; color:white; font-size:14px; }
    button.secondary { background:#475569; }
    button:disabled { opacity:.55; cursor:default; }
    button:focus-visible { outline:2px solid #60a5fa; outline-offset:2px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Hay una actualización lista</h1>
    <p id="impact"></p>
    <p id="notes"></p>
    <p id="countdown" role="status" aria-live="polite"></p>
    <div class="actions">
      <button class="secondary" id="postpone">Posponer</button>
      <button id="install">Instalar ahora</button>
    </div>
  </main>
  <script src="auto-update.js"></script>
</body>
</html>

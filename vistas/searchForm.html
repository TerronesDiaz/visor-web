<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Buscar imagen</title>
    <link
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <form id="searchForm" class="d-flex">
        <input
          type="search"
          class="form-control me-2"
          id="query"
          placeholder="Escriba su búsqueda aquí"
          required
        />
        <button type="submit" class="btn btn-primary">Buscar</button>
      </form>
      <div id="notification" class="mt-2"></div>
      <p class="text-muted mt-2">La búsqueda se abrirá en el navegador y requiere internet.</p>
      <p>Presione la tecla <strong>F7</strong> para cerrar esta ventana.</p>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        try {
          const bridge = window.terrones.search;

          // Escuchar las respuestas del proceso principal
          bridge.onSuccess(() => {
            document.getElementById('notification').textContent = 'La búsqueda se abrió en el navegador.';
          });

          bridge.onError(() => {
            document.getElementById('notification').textContent = 'No fue posible descargar la imagen. Esta función requiere internet.';
          });

          document
            .getElementById("searchForm")
            .addEventListener("submit", function (e) {
              e.preventDefault();
              let searchQuery = document.getElementById("query").value;
              console.log(`Consulta de búsqueda original: ${searchQuery}`);

              // Sanitizar la búsqueda
              searchQuery = searchQuery.replace(/[^a-zA-Z0-9 ]/g, "");
              console.log(`Consulta de búsqueda sanitizada: ${searchQuery}`);

              document.getElementById('notification').textContent = 'Abriendo búsqueda web…';
              bridge.perform(searchQuery);
            });

          // Agregar la función para cerrar la ventana con F7
          window.addEventListener("keydown", (e) => {
            if (e.key === "F7") {
              console.log("Tecla F7 presionada. Cerrando ventana.");
              window.terrones.window.close();
            }
          });
        } catch (error) {
          console.error("Ha ocurrido un error:", error);
        }
      });
    </script>
  </body>
</html>
